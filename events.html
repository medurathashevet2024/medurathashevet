<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מדורת השבט - מסיבות ואירועים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --forest-green: #1b3820;
            --forest-mid: #2d5a37;
            --forest-light: #f0f5f1;
            --earth-brown: #4a3329;
            --earth-light: #8c6d5e;
            --campfire-orange: #e65c00;
            --campfire-glow: #ff751a;
            --sandy-bg: #faf6f0;
            --text-dark: #1f2421;
            --text-muted: #58635a;
            --white: #ffffff;
            --transition: all 0.3s ease;
            --shadow-sm: 0 4px 15px rgba(27, 56, 32, 0.05);
            --shadow-md: 0 12px 35px rgba(27, 56, 32, 0.08);
            --shadow-lg: 0 20px 45px rgba(27, 56, 32, 0.14);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
        body { font-family: 'Assistant', sans-serif; background-color: var(--sandy-bg); color: var(--text-dark); line-height: 1.7; overflow-x: hidden; }
        h1, h2, h3, .logo-text { font-family: 'Secular One', sans-serif; }

        header {
            background-color: rgba(27, 56, 32, 0.98); backdrop-filter: blur(12px);
            position: fixed; top: 0; width: 100%; z-index: 1000;
            box-shadow: 0 4px 25px rgba(0,0,0,0.15); border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-container { max-width: 1300px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; }
        .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .brand-logo .logo-text { color: var(--sandy-bg); font-size: 26px; font-weight: bold; }
        nav ul { display: flex; list-style: none; gap: 18px; align-items: center; }
        nav a { color: #d4e2d5; text-decoration: none; font-weight: 600; font-size: 15px; transition: var(--transition); }
        nav a:hover { color: var(--white); }

        .phone-nav-link {
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.12); padding: 8px 12px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.25);
            transition: var(--transition);
        }
        .phone-nav-link:hover { background: rgba(255, 255, 255, 0.25); transform: scale(1.08); }
        .wa-header-icon { width: 26px; height: 26px; object-fit: contain; vertical-align: middle; }

        /* רקע Hero מעודכן: שמי לילה כהים עם כוכבים וצלליות בתים ועצים למטה */
        .hero {
            background: linear-gradient(rgba(15, 33, 18, 0.65), rgba(20, 25, 20, 0.75)), 
                        url('https://images.unsplash.com/photo-1517824806704-9040b037703b?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            height: 55vh; min-height: 420px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: var(--white); padding: 0 24px; margin-top: 65px;
        }

        .hero h1 { font-size: 50px; margin-bottom: 12px; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .hero p { font-size: 22px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); font-weight: 300; max-width: 800px; }

        .wrapper { max-width: 1200px; margin: 0 auto; padding: 50px 24px; }
        .section-header { text-align: center; margin-bottom: 35px; }
        .section-header h2 { font-size: 38px; color: var(--forest-green); position: relative; display: inline-block; }
        .section-header h2::after { content: ''; position: absolute; bottom: -8px; left: 30%; width: 40%; height: 3px; background-color: var(--campfire-orange); border-radius: 2px; }

        section { background: var(--white); padding: 45px; border-radius: 24px; box-shadow: var(--shadow-md); margin-bottom: 50px; border: 1px solid rgba(27, 56, 32, 0.04); }

        .intro-box { font-size: 19px; line-height: 1.8; text-align: center; max-width: 900px; margin: 0 auto 30px auto; color: var(--text-dark); }
        .how-it-works { background: var(--forest-light); padding: 30px; border-radius: 18px; border-right: 5px solid var(--forest-green); margin-bottom: 30px; }
        .how-it-works h3 { color: var(--forest-green); font-size: 22px; margin-bottom: 12px; }

        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 25px; margin-bottom: 30px; }
        .card { background-color: var(--sandy-bg); padding: 12px; border-radius: 18px; border-top: 5px solid var(--earth-brown); box-shadow: var(--shadow-sm); transition: var(--transition); text-align: center; }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-top-color: var(--campfire-orange); }
        .card img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; }
        .card p { margin-top: 10px; font-weight: 600; color: var(--forest-green); font-size: 16px; }

        .packages-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 30px; margin-top: 30px; }
        .package-card {
            background: var(--white); border-radius: 22px; border: 2px solid #e1e9e2; padding: 35px 25px;
            display: flex; flex-direction: column; justify-content: space-between; position: relative;
            box-shadow: var(--shadow-sm); transition: var(--transition);
        }
        .package-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); border-color: var(--campfire-orange); }
        .package-card.featured { border-color: var(--campfire-orange); background: #fffcf8; }
        .package-badge { position: absolute; top: -15px; right: 20px; background: var(--campfire-orange); color: var(--white); font-weight: bold; padding: 4px 16px; border-radius: 20px; font-size: 14px; }
        .package-card h3 { color: var(--forest-green); font-size: 26px; margin-bottom: 15px; border-bottom: 2px solid var(--forest-light); padding-bottom: 10px; }
        .package-features { list-style: none; margin-bottom: 25px; }
        .package-features li { margin-bottom: 12px; font-size: 16px; display: flex; align-items: flex-start; gap: 10px; }
        .package-features li i { color: var(--campfire-orange); margin-top: 5px; }
        
        .package-price { background: var(--forest-light); padding: 18px; border-radius: 14px; text-align: center; font-size: 20px; font-weight: 800; color: var(--forest-green); }
        .package-price span { color: var(--campfire-orange); font-size: 26px; }
        .more-info-link { font-size: 14px; margin-top: 8px; font-weight: normal; }
        .more-info-link a { color: var(--campfire-orange); font-weight: bold; text-decoration: underline; }

        .upgrades-box { background: var(--sandy-bg); border-radius: 18px; padding: 30px; border: 1.5px dashed var(--earth-light); margin-top: 30px; }
        .upgrades-box h3 { color: var(--earth-brown); margin-bottom: 15px; }

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הרשמה לפעילויות - מדורת השבט</title>
    <style>
        :root {
            --primary-color: #1b3820;
            --accent-orange: #e65c00;
            --bg-light: #f4f7f4;
            --text-dark: #2c3e50;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #faf6f0;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .booking-container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e0e8e0;
        }

        .top-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding-bottom: 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e4ece4;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.92rem;
            padding: 7px 14px;
            border-radius: 20px;
            transition: background 0.2s, color 0.2s;
        }

        .back-hanukkah {
            background-color: #fff4e8;
            color: var(--accent-orange);
            border: 1px solid rgba(230, 92, 0, 0.25);
        }
        .back-hanukkah:hover {
            background-color: var(--accent-orange);
            color: #ffffff;
        }

        .back-home {
            background-color: var(--bg-light);
            color: var(--primary-color);
            border: 1px solid #d4e0d5;
        }
        .back-home:hover {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        h1 { color: var(--primary-color); text-align: center; margin: 0 0 8px 0; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; }

        .form-section {
            background-color: var(--bg-light);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-right: 4px solid var(--accent-orange);
        }

        .form-section h3 { margin-top: 0; color: var(--primary-color); font-size: 1.1rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .row-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .row-group .form-group { flex: 1; min-width: 180px; }

        .kids-ages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
        }
        .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent-orange); }

        .submit-btn {
            width: 100%;
            background-color: var(--accent-orange);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover { background-color: #b85419; }

        .price-summary {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--primary-color);
            text-align: center;
            font-size: 1.15rem;
        }

        .fighter-note {
            background-color: #e8f5e9;
            color: #1b3820;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.92rem;
            text-align: center;
            margin-bottom: 18px;
            border: 1px solid #c8e6c9;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="booking-container">
    <div class="top-nav-bar">
        <a href="hanukkah.html" class="back-link back-hanukkah">→ חזרה לעמוד חנוכה</a>
        <a href="index.html" class="back-link back-home">דף הבית</a>
    </div>

    <h1>הרשמה לפעילות</h1>
    <p class="subtitle">מדורת השבט חנוכה של אש ומלאכות ביער 🕯️🌲🔥</p>

    <div class="fighter-note">
        🎖️ משרתי מילואים? ניתן לשלם עם <strong>כרטיס פייטר</strong>!
    </div>

    <form id="mainBookingForm">
        <!-- 1. בחירת פעילות -->
        <div class="form-section">
            <h3>1. בחירת פעילות</h3>
            <div class="form-group" style="margin-bottom: 0;">
                <select id="activitySelect" onchange="handleActivityChange()" required>
                    <option value="">-- טוען פעילויות זמינות... --</option>
                </select>
            </div>
        </div>

        <!-- 2. פרטי מבוגר מלווה -->
        <div class="form-section">
            <h3>2. פרטי מבוגר</h3>
            <div class="row-group">
                <div class="form-group">
                    <label for="parentName">שם מלא:</label>
                    <input type="text" id="parentName" required>
                </div>
                <div class="form-group">
                    <label for="parentPhone">טלפון נייד:</label>
                    <input type="tel" id="parentPhone" required placeholder="050-0000000">
                </div>
            </div>
            <div class="form-group">
                <label for="parentEmail">דוא"ל:</label>
                <input type="email" id="parentEmail" required>
            </div>
        </div>

        <!-- 3. פרטי המשתתפים -->
        <div class="form-section" id="participantsSection">
            <h3>3. פרטי המשתתפים</h3>
        </div>

        <!-- 4. הנחות ותשלום -->
        <div class="form-section">
            <h3>4. הנחות</h3>
            <div class="row-group">
                <div class="form-group">
                    <label for="couponInput">קוד קופון:</label>
                    <input type="text" id="couponInput" placeholder="הכנס קוד קופון" oninput="calculatePrice()">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button type="button" onclick="calculatePrice()" style="width: 100%; padding: 10px; background: #2d5a37; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">החל קופון</button>
                </div>
            </div>
            <div id="couponMsg" style="font-size: 0.9rem; margin-bottom: 10px;"></div>

            <div class="price-summary" id="priceSummaryBox" style="display:none;">
                סה"כ לתשלום: <span id="finalPriceText">0</span> ₪
            </div>

            <div class="row-group">
                <div class="form-group">
                    <label for="paymentMethod">אמצעי תשלום מועדף:</label>
                    <select id="paymentMethod" onchange="toggleInstallments()" required>
                        <option value="ביט">ביט</option>
                        <option value="כרטיס פייטר (משרתי מילואים)">כרטיס פייטר (משרתי מילואים)</option>
                        <option value="העברה בנקאית">העברה בנקאית</option>
                        <option value="כרטיס אשראי">כרטיס אשראי</option>
                        <option value="מזומן במקום">מזומן במקום</option>
                    </select>
                </div>
                <div class="form-group" id="installmentsGroup" style="display: none;">
                    <label for="installments">מספר תשלומים:</label>
                    <select id="installments">
                        <option value="1 תשלום">תשלום 1</option>
                        <option value="2 תשלומים">2 תשלומים</option>
                        <option value="3 תשלומים">3 תשלומים</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">הערות נוספות:</label>
                <textarea id="notes" rows="2" placeholder="בקשות מיוחדות והערות..."></textarea>
            </div>
        </div>

        <button type="submit" class="submit-btn">המשך</button>
    </form>
</div>

<script>
    const activities = [
        { id: 'hanukkah-adults-04-12', name: '4.12 זמן יער למבוגרים | יער רמת מנשה', type: 'adults' },
        { id: 'hanukkah-solo-camp-04-05-12', name: '4–5.12 קמפינג משפחות יחידניות', type: 'camping' },
        { id: 'hanukkah-givat-more-07-12', name: '7.12 זמן יער גבעת המורה', type: 'workshop65' },
        { id: 'hanukkah-jordan-valley-09-12', name: '9.12 זמן יער עמק הירדן', type: 'workshop65' },
        { id: 'hanukkah-morning-10-12', name: '10.12 זמן יער רמת השופט', type: 'workshop65' },
        { id: 'hanukkah-family-camp-10-11-12', name: '10–11.12 קמפינג משפחות רמת השופט', type: 'camping' },
        { id: 'hanukkah-shabbat-11-12', name: '11.12 קבלת שבת רמת השופט', type: 'workshop65' },
        { id: 'journey-04-12', name: 'זמן הורה וילד.ה (מפגש שני) - 04.12.2026', type: 'journey', basePrice: 390 },
        { id: 'journey-10-12', name: 'זמן הורה וילד.ה (סופ"ש חנוכה) - 10-11.12.2026', type: 'journey', basePrice: 780 }
    ];

    const activitySelect = document.getElementById('activitySelect');

    function toggleInstallments() {
        const paymentMethod = document.getElementById('paymentMethod').value;
        const installmentsGroup = document.getElementById('installmentsGroup');
        if (paymentMethod === 'כרטיס אשראי') {
            installmentsGroup.style.display = 'block';
        } else {
            installmentsGroup.style.display = 'none';
            document.getElementById('installments').value = '1 תשלום';
        }
    }

    function loadActivities() {
        activitySelect.innerHTML = '<option value="">-- בחר/י פעילות --</option>';
        const urlParams = new URLSearchParams(window.location.search);
        const selectedFromUrl = urlParams.get('activity');

        activities.forEach(act => {
            const option = document.createElement('option');
            option.value = act.id;
            option.textContent = act.name;
            option.dataset.type = act.type;
            if (act.basePrice) {
                option.dataset.price = act.basePrice;
            }
            if (selectedFromUrl === act.id) {
                option.selected = true;
            }
            activitySelect.appendChild(option);
        });
        handleActivityChange();
        toggleInstallments();
    }

    function renderAgeFields(containerId, count) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const safeCount = Math.max(0, Math.min(10, parseInt(count) || 0));
        container.innerHTML = '';

        for (let i = 1; i <= safeCount; i++) {
            const div = document.createElement('div');
            div.className = 'form-group';
            div.style.marginBottom = '0';
            div.innerHTML = `
                <label for="${containerId}_age_${i}">גיל ילד/ה ${i}:</label>
                <input type="number" id="${containerId}_age_${i}" min="0" max="18" step="0.5" required placeholder="גיל" oninput="calculatePrice()">
            `;
            container.appendChild(div);
        }
    }

    function collectAges(containerId, count) {
        const ages = [];
        const safeCount = Math.max(0, Math.min(10, parseInt(count) || 0));
        for (let i = 1; i <= safeCount; i++) {
            const input = document.getElementById(`${containerId}_age_${i}`);
            if (input && input.value !== '') {
                ages.push(parseFloat(input.value));
            }
        }
        return ages;
    }

    function handleActivityChange() {
        const selectedOption = activitySelect.options[activitySelect.selectedIndex];
        const section = document.getElementById('participantsSection');
        section.innerHTML = '<h3>3. פרטי המשתתפים</h3>';

        if (!selectedOption || !selectedOption.dataset.type) {
            section.innerHTML += '<p style="color:#666;">יש לבחור פעילות כדי להציג את השדות המתאימים.</p>';
            document.getElementById('priceSummaryBox').style.display = 'none';
            return;
        }

        const type = selectedOption.dataset.type;

        if (type === 'adults') {
            section.innerHTML += `
                <div class="form-group">
                    <label for="adultsParticipants">בחרו הרכב משתתפים:</label>
                    <select id="adultsParticipants" onchange="calculatePrice()" required>
                        <option value="1">משתתף/ת 1 (120 ₪)</option>
                        <option value="2">זוג / 2 משתתפים (220 ₪)</option>
                    </select>
                </div>
            `;
        } else if (type === 'workshop65') {
            section.innerHTML += `
                <div class="row-group">
                    <div class="form-group">
                        <label for="w65Adults">מספר מבוגרים (65 ₪ למשתתף):</label>
                        <select id="w65Adults" onchange="calculatePrice()" required>
                            <option value="1">1 מבוגר</option>
                            <option value="2">2 מבוגרים</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="w65Kids">מספר ילדים (חיוב מגיל 3 ומעלה — 65 ₪ למשתתף):</label>
                        <input type="number" id="w65Kids" min="0" max="10" value="1" oninput="renderAgeFields('workshopAges', this.value); calculatePrice();" required>
                    </div>
                </div>
                <div id="workshopAges" class="kids-ages-grid"></div>
            `;
            renderAgeFields('workshopAges', 1);
        } else if (type === 'camping') {
            section.innerHTML += `
                <div class="row-group">
                    <div class="form-group">
                        <label for="campAdults">מספר מבוגרים (250 ₪ למבוגר):</label>
                        <input type="number" id="campAdults" min="1" max="6" value="1" oninput="calculatePrice()" required>
                    </div>
                    <div class="form-group">
                        <label for="campKids">מספר ילדים (חיוב מגיל שנתיים: 170 ₪ לילד 1–2, 50 ₪ מילד 3):</label>
                        <input type="number" id="campKids" min="0" max="10" value="1" oninput="renderAgeFields('campKidsAges', this.value); calculatePrice();" required>
                    </div>
                </div>
                <div id="campKidsAges" class="kids-ages-grid"></div>
                <label class="checkbox-row">
                    <input type="checkbox" id="withOwnTent" onchange="calculatePrice()">
                    <span>מגיעים עם אוהל ומזרנים מהבית (100 ₪ הנחה)</span>
                </label>
            `;
            renderAgeFields('campKidsAges', 1);
        } else {
            section.innerHTML += `
                <div class="row-group">
                    <div class="form-group">
                        <label for="childAge">גיל הילד/ה (חיוב מגיל 3 ומעלה):</label>
                        <input type="number" id="childAge" min="0" max="18" step="0.5" required oninput="calculatePrice()">
                    </div>
                </div>
            `;
        }
        calculatePrice();
    }

    function calculatePrice() {
        const selectedOption = activitySelect.options[activitySelect.selectedIndex];
        if (!selectedOption || !selectedOption.dataset.type) return;

        let basePrice = 0;
        const type = selectedOption.dataset.type;

        if (type === 'adults') {
            const count = parseInt(document.getElementById('adultsParticipants').value) || 1;
            basePrice = (count === 2) ? 220 : 120;
        } else if (type === 'workshop65') {
            const adults = parseInt(document.getElementById('w65Adults').value) || 1;
            const kids = Math.max(0, parseInt(document.getElementById('w65Kids').value) || 0);
            const ages = collectAges('workshopAges', kids);
            const payableKids = ages.filter(age => age >= 3).length;
            basePrice = (adults + payableKids) * 65;
        } else if (type === 'camping') {
            const adults = Math.max(1, parseInt(document.getElementById('campAdults').value) || 1);
            const kids = Math.max(0, parseInt(document.getElementById('campKids').value) || 0);
            const ages = collectAges('campKidsAges', kids);
            const payableKids = ages.filter(age => age >= 2).length;
            const withOwnTent = document.getElementById('withOwnTent') ? document.getElementById('withOwnTent').checked : false;

            let kidsPrice = 0;
            if (payableKids === 1) kidsPrice = 170;
            else if (payableKids === 2) kidsPrice = 340;
            else if (payableKids >= 3) kidsPrice = 340 + (payableKids - 2) * 50;

            basePrice = (adults * 250) + kidsPrice - (withOwnTent ? 100 : 0);
            basePrice = Math.max(0, basePrice);
        } else {
            const childAgeInput = document.getElementById('childAge');
            const age = childAgeInput && childAgeInput.value !== '' ? parseFloat(childAgeInput.value) : 3;
            basePrice = age >= 3 ? parseInt(selectedOption.dataset.price || 0) : 0;
        }

        const couponInput = document.getElementById('couponInput').value.trim().toUpperCase();
        const couponMsg = document.getElementById('couponMsg');
        let discount = 0;

        if (couponInput === 'CLICKBATEVA26') {
            discount = Math.round(basePrice * 0.10);
            couponMsg.style.color = '#2e4d36';
            couponMsg.innerText = 'קוד קופון הוחל בהצלחה (10% הנחה)';
        } else if (couponInput !== '') {
            couponMsg.style.color = '#c0392b';
            couponMsg.innerText = 'קוד קופון שגוי או אינו בתוקף';
        } else {
            couponMsg.innerText = '';
        }

        const finalPrice = Math.max(0, basePrice - discount);
        document.getElementById('finalPriceText').innerText = finalPrice;
        document.getElementById('priceSummaryBox').style.display = 'block';
    }

    loadActivities();

    document.getElementById('mainBookingForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const selectedOption = activitySelect.options[activitySelect.selectedIndex];
        const activityName = selectedOption.text;
        const activityType = selectedOption.dataset.type;

        const parentName = document.getElementById('parentName').value;
        const parentPhone = document.getElementById('parentPhone').value;
        const parentEmail = document.getElementById('parentEmail').value;
        const paymentMethod = document.getElementById('paymentMethod').value;
        const installmentsText = paymentMethod === 'כרטיס אשראי'
            ? ` (${document.getElementById('installments').value})`
            : '';
        const notes = document.getElementById('notes').value || 'אין';

        let participantsText = '';

        if (activityType === 'adults') {
            const count = parseInt(document.getElementById('adultsParticipants').value) || 1;
            participantsText = `מספר מבוגרים: ${count} (${count === 2 ? 'זוג - 220 ₪' : 'יחיד/ה - 120 ₪'})\nמספר ילדים: 0\n`;
        } else if (activityType === 'workshop65') {
            const adults = parseInt(document.getElementById('w65Adults').value) || 1;
            const kids = parseInt(document.getElementById('w65Kids').value) || 0;
            const ages = collectAges('workshopAges', kids);
            const payableKids = ages.filter(age => age >= 3).length;
            const agesDisplay = kids > 0 ? ages.join(', ') : 'אין';
            participantsText = `מספר מבוגרים: ${adults}\nמספר ילדים: ${kids} (מחויבים בתשלום מגיל 3+: ${payableKids})\nגילאי הילדים: ${agesDisplay}\n`;
        } else if (activityType === 'camping') {
            const adults = parseInt(document.getElementById('campAdults').value) || 1;
            const kids = parseInt(document.getElementById('campKids').value) || 0;
            const ages = collectAges('campKidsAges', kids);
            const payableKids = ages.filter(age => age >= 2).length;
            const agesDisplay = kids > 0 ? ages.join(', ') : 'אין';
            const withOwnTent = document.getElementById('withOwnTent') && document.getElementById('withOwnTent').checked ? 'כן' : 'לא';
            participantsText = `מספר מבוגרים: ${adults}\nמספר ילדים: ${kids} (מחויבים בתשלום מגיל 2+: ${payableKids})\nגילאי הילדים: ${agesDisplay}\nמגיעים עם אוהל: ${withOwnTent}\n`;
        } else {
            const age = parseFloat(document.getElementById('childAge').value);
            const payableStatus = age >= 3 ? 'מחויב/ת בתשלום (גיל 3+)' : 'ללא חיוב (מתחת לגיל 3)';
            participantsText = `מספר מבוגרים: 1\nמספר ילדים: 1\nגילאי הילדים: ${age} (${payableStatus})\n`;
        }

        const finalPrice = document.getElementById('finalPriceText').innerText;

        const whatsappText = `היי, נרשמתי דרך האתר 🌲\n` +
            `פעילות: ${activityName}\n` +
            `שם מלא: ${parentName}\n` +
            `טלפון: ${parentPhone}\n` +
            `אימייל: ${parentEmail}\n` +
            participantsText +
            `אמצעי תשלום מועדף: ${paymentMethod}${installmentsText}\n` +
            `סה"כ לתשלום: ${finalPrice} ₪\n` +
            `הערות: ${notes}\n\n` +
            `תודה על הרשמתכם, קישור לתשלום יישלח עד סוף יום העסקים.`;

        const phoneNumber = "972559914540";
        const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(whatsappText)}`;
        window.open(whatsappUrl, '_blank');
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הרשמה לפעילויות - מדורת השבט</title>
    <style>
        :root {
            --primary-color: #1b3820;
            --accent-orange: #e65c00;
            --bg-light: #f4f7f4;
            --text-dark: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #faf6f0;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .booking-container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e0e8e0;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-section {
            background-color: var(--bg-light);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-right: 4px solid var(--accent-orange);
        }

        .form-section h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        .row-group {
            display: flex;
            gap: 12px;
        }

        .row-group .form-group {
            flex: 1;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--accent-orange);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: #b85419;
        }

        .price-summary {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--primary-color);
            text-align: center;
            font-size: 1.1rem;
        }

        .early-bird-note {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 15px;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

<div class="booking-container">
    <h1>הרשמה לפעילות</h1>
    <p class="subtitle">מדורת השבט - חיבור לטבע ולקהילה</p>

    <div class="early-bird-note">
        ✨ <strong>הנחת הרשמה מוקדמת:</strong> 10% הנחה אוטומטית על מסלול כל 3 המפגשים לנרשמים עד ה-12.11.2026!
    </div>

    <form id="mainBookingForm">
        <!-- 1. בחירת פעילות -->
        <div class="form-section">
            <h3>1. בחירת אירוע/פעילות</h3>
            <div class="form-group">
                <label for="activitySelect">בחר/י פעילות:</label>
                <select id="activitySelect" onchange="handleActivityChange()" required>
                    <option value="">-- טוען פעילויות זמינות... --</option>
                </select>
            </div>
        </div>

        <!-- 2. פרטי מבוגר מלווה -->
        <div class="form-section">
            <h3>2. פרטי מבוגר אחראי</h3>
            <div class="row-group">
                <div class="form-group">
                    <label for="parentName">שם מלא:</label>
                    <input type="text" id="parentName" required>
                </div>
                <div class="form-group">
                    <label for="parentPhone">טלפון נייד:</label>
                    <input type="tel" id="parentPhone" required placeholder="050-0000000">
                </div>
            </div>
            <div class="form-group">
                <label for="parentEmail">דוא"ל:</label>
                <input type="email" id="parentEmail" required>
            </div>
        </div>

        <!-- 3. פרטי המשתתפים -->
        <div class="form-section" id="participantsSection">
            <h3>3. פרטי המשתתפים</h3>
        </div>

        <!-- 4. קופונים ותשלום -->
        <div class="form-section">
            <h3>4. תשלום והטבות</h3>
            <div class="row-group">
                <div class="form-group">
                    <label for="couponInput">קוד קופון (אופציונלי):</label>
                    <input type="text" id="couponInput" placeholder="הכנס קוד קופון" oninput="calculatePrice()">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button type="button" onclick="calculatePrice()" style="width: 100%; padding: 10px; background: #2d5a37; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">החל קופון</button>
                </div>
            </div>
            <div id="couponMsg" style="font-size: 0.9rem; margin-bottom: 10px;"></div>

            <div class="price-summary" id="priceSummaryBox" style="display:none;">
                סה"כ לתשלום: <span id="finalPriceText">0</span> ₪
            </div>

            <div class="row-group">
                <div class="form-group">
                    <label for="paymentMethod">אמצעי תשלום מועדף:</label>
                    <select id="paymentMethod" required>
                        <option value="ביט / פייבוקס">ביט / PayBox</option>
                        <option value="העברה בנקאית">העברה בנקאית</option>
                        <option value="כרטיס אשראי">כרטיס אשראי</option>
                        <option value="כרטיס פייטר (משרתי מילואים)">כרטיס פייטר (משרתי מילואים)</option>
                        <option value="מזומן במקום">מזומן במקום</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="installments">מספר תשלומים:</label>
                    <select id="installments" required>
                        <option value="1 תשלום">תשלום 1</option>
                        <option value="2 תשלומים">2 תשלומים</option>
                        <option value="3 תשלומים">3 תשלומים</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">הערות נוספות:</label>
                <textarea id="notes" rows="2" placeholder="בקשות מיוחדות..."></textarea>
            </div>
        </div>

        <button type="submit" class="submit-btn">המשך</button>
    </form>
</div>

<script>
    const activities = [
        { id: 'yaar-20-11', name: 'יום יער וקבלת שבת שבטית - 20.11.2026', date: '2026-11-20', type: 'yaar' },
        { id: 'journey-all', name: 'מסלול מלא - כל 3 המפגשים של זמן הורה וילד.ה', date: '2026-11-20', type: 'journey', basePrice: 1560, isEarlyBird: true },
        { id: 'journey-20-11', name: 'זמן הורה וילד.ה - 20.11.2026 (רמת מנשה)', date: '2026-11-20', type: 'journey', basePrice: 390 },
        { id: 'journey-04-12', name: 'זמן הורה וילד.ה (מפגש שני) - 04.12.2026', date: '2026-12-04', type: 'journey', basePrice: 390 },
        { id: 'journey-10-12', name: 'זמן הורה וילד.ה (סופ"ש חנוכה) - 10-11.12.2026', date: '2026-12-10', type: 'journey', basePrice: 780 }
    ];

    const activitySelect = document.getElementById('activitySelect');

    function loadActivities() {
        activitySelect.innerHTML = '<option value="">-- בחר/י פעילות --</option>';
        const urlParams = new URLSearchParams(window.location.search);
        const selectedFromUrl = urlParams.get('activity');

        activities.forEach(act => {
            const option = document.createElement('option');
            option.value = act.id;
            option.textContent = act.name;
            option.dataset.type = act.type;
            option.dataset.date = act.date;
            if (act.basePrice) {
                option.dataset.price = act.basePrice;
            }
            if (act.isEarlyBird) {
                option.dataset.earlyBird = "true";
            }
            if (selectedFromUrl === act.id) {
                option.selected = true;
            }
            activitySelect.appendChild(option);
        });
        handleActivityChange();
    }

    function handleActivityChange() {
        const selectedOption = activitySelect.options[activitySelect.selectedIndex];
        const section = document.getElementById('participantsSection');
        section.innerHTML = '<h3>3. פרטי המשתתפים</h3>';

        if (!selectedOption || !selectedOption.dataset.type) {
            section.innerHTML += '<p style="color:#666;">יש לבחור פעילות כדי להציג את השדות המתאימים.</p>';
            document.getElementById('priceSummaryBox').style.display = 'none';
            return;
        }

        const type = selectedOption.dataset.type;

        if (type === 'yaar') {
            section.innerHTML += `
                <div class="row-group">
                    <div class="form-group">
                        <label for="adultsCount">מספר מבוגרים:</label>
                        <select id="adultsCount" onchange="calculatePrice()" required>
                            <option value="1">1 מבוגר/ת</option>
                            <option value="2">2 מבוגרים</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="kidsCount">מספר ילדים:</label>
                        <select id="kidsCount" onchange="updateYaarKidsInputs(); calculatePrice();" required>
                            <option value="1">ילד/ה 1</option>
                            <option value="2">2 ילדים</option>
                            <option value="3">3 ילדים</option>
                            <option value="4">4 ילדים</option>
                            <option value="5">5 ילדים</option>
                        </select>
                    </div>
                </div>
                <div id="yaarKidsAgesContainer"></div>
            `;
            updateYaarKidsInputs();
        } else {
            section.innerHTML += `
                <div class="row-group">
                    <div class="form-group">
                        <label for="childName">שם הילד/ה:</label>
                        <input type="text" id="childName" required>
                    </div>
                    <div class="form-group">
                        <label for="childAge">גיל הילד/ה:</label>
                        <input type="number" id="childAge" min="1" max="18" required>
                    </div>
                    <div class="form-group">
                        <label for="childGender">מין הילד/ה:</label>
                        <select id="childGender" required>
                            <option value="">בחר/י</option>
                            <option value="בן">בן</option>
                            <option value="בת">בת</option>
                        </select>
                    </div>
                </div>
            `;
        }
        calculatePrice();
    }

    function updateYaarKidsInputs() {
        const count = parseInt(document.getElementById('kidsCount').value);
        const container = document.getElementById('yaarKidsAgesContainer');
        container.innerHTML = '';

        for (let i = 1; i <= count; i++) {
            const div = document.createElement('div');
            div.className = 'form-group';
            div.innerHTML = `
                <label for="yaarChildAge_${i}">גיל ילד/ה ${i}:</label>
                <input type="number" id="yaarChildAge_${i}" min="1" max="18" placeholder="הכנס גיל" required>
            `;
            container.appendChild(div);
        }
    }

    function calculatePrice() {
        const selectedOption = activitySelect.options[activitySelect.selectedIndex];
        if (!selectedOption || !selectedOption.dataset.type) return;

        let basePrice = 0;
        const type = selectedOption.dataset.type;

        if (type === 'yaar') {
            const adults = parseInt(document.getElementById('adultsCount').value) || 1;
            const kids = parseInt(document.getElementById('kidsCount').value) || 1;
            const totalParticipants = adults + kids;

            // בדיקת חריגה מעל 6 משתתפים
            if (totalParticipants > 6) {
                document.getElementById('couponMsg').style.color = '#c0392b';
                document.getElementById('couponMsg').innerText = 'סך המשתתפים המקסימלי ביום יער הוא עד 6 משתתפים.';
                document.getElementById('priceSummaryBox').style.display = 'none';
                return;
            }

            // חישוב מחיר אוטומטי לפי סך המשתתפים
            if (totalParticipants === 2) {
                basePrice = 190; // זוג (הורה + ילד.ה)
            } else if (totalParticipants === 3) {
                basePrice = 255; // 3 משתתפים
            } else {
                basePrice = 290; // 4 עד 6 משתתפים
            }
        } else {
            basePrice = parseInt(selectedOption.dataset.price || 0);
        }

        const activityDate = selectedOption.dataset.date;
        const isEarlyBird = selectedOption.dataset.earlyBird === "true";
        const couponInput = document.getElementById('couponInput').value.trim().toUpperCase();
        const couponMsg = document.getElementById('couponMsg');

        let discount = 0;

        if (isEarlyBird) {
            discount = Math.round(basePrice * 0.10);
        }

        if (couponInput === 'CLICKBATEVA26') {
            discount = Math.round(basePrice * 0.10);
            couponMsg.style.color = '#2e4d36';
            couponMsg.innerText = 'קוד קופון הוחל בהצלחה (10% הנחה)';
        } 
        else if (couponInput === 'XTRA25' && activityDate === '2026-11-20') {
            discount = Math.round(basePrice * 0.25);
            couponMsg.style.color = '#2e4d36';
            couponMsg.innerText = 'קוד קופון XTRA25 הוחל בהצלחה (25% הנחה)';
        } 
        else if (couponInput.length >= 4) {
            discount = Math.round(basePrice * 0.10);
            couponMsg.style.color = '#2e4d36';
            couponMsg.innerText = 'קוד קופון הוחל בהצלחה';
        } 
        else if (couponInput !== '') {
            couponMsg.style.color = '#c0392b';
            couponMsg.innerText = 'קוד קופון שגוי או אינו תקף לפעילות זו';
        } else {
            if (isEarlyBird) {
                couponMsg.style.color = '#2e4d36';
                couponMsg.innerText = 'הופעלה הנחת הרשמה מוקדמת (10%)!';
            } else {
                couponMsg.innerText = '';
            }
        }

        const finalPrice = Math.max(0, basePrice - discount);
        document.getElementById('finalPriceText').innerText = finalPrice;
        document.getElementById('priceSummaryBox').style.display = 'block';
    }

    loadActivities();

    document.getElementById('mainBookingForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const selectedOption = activitySelect.options[activitySelect.selectedIndex];
        const activityName = selectedOption.text;
        const activityType = selectedOption.dataset.type;

        if (activityType === 'yaar') {
            const adults = parseInt(document.getElementById('adultsCount').value) || 1;
            const kids = parseInt(document.getElementById('kidsCount').value) || 1;
            if ((adults + kids) > 6) {
                alert('שגיאה: סך המשתתפים ביום יער אינו יכול לעלות על 6 אנשים.');
                return;
            }
        }

        const parentName = document.getElementById('parentName').value;
        const parentPhone = document.getElementById('parentPhone').value;
        const paymentMethod = document.getElementById('paymentMethod').value;
        const installments = document.getElementById('installments').value;
        const notes = document.getElementById('notes').value || 'אין';

        let participantsText = '';

        if (activityType === 'yaar') {
            const adults = document.getElementById('adultsCount').value;
            const kidsCount = parseInt(document.getElementById('kidsCount').value);
            let ages = [];
            for (let i = 1; i <= kidsCount; i++) {
                ages.push(document.getElementById(`yaarChildAge_${i}`).value);
            }
            let packageDesc = "זוג (190 ₪)";
            let totalP = parseInt(adults) + kidsCount;
            if (totalP === 3) packageDesc = "3 משתתפים (255 ₪)";
            if (totalP >= 4) packageDesc = "4-6 משתתפים (290 ₪)";

            participantsText = `מסלול: ${packageDesc}%0Aמבוגרים: ${adults}%0Aילדים: ${kidsCount} (גילאים: ${ages.join(', ')})%0A`;
        } else {
            const childName = document.getElementById('childName').value;
            const childAge = document.getElementById('childAge').value;
            const childGender = document.getElementById('childGender').value;
            participantsText = `שם הילד/ה: ${childName} (גיל ${childAge}, ${childGender})%0A`;
        }

        const finalPrice = document.getElementById('finalPriceText').innerText;

        const whatsappText = `היי טליה, נרשמתי דרך האתר! 🌲%0A` +
            `פעילות: ${activityName}%0A` +
            `שם הורה: ${parentName}%0A` +
            `טלפון: ${parentPhone}%0A` +
            participantsText +
            `סה"כ לתשלום: ${finalPrice} ₪%0A` +
            `תשלום: ${paymentMethod} (${installments})%0A` +
            `הערות: ${notes}`;

        const phoneNumber = "972559914540";
        const whatsappUrl = `https://api.whatsapp.com/send?phone=${phoneNumber}&text=${whatsappText}`;
        window.location.href = whatsappUrl;
    });
</script>

</body>
</html>

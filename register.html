<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הרשמה לפעילויות - מדורת השבט</title>
    <style>
        :root {
            --primary-color: #1b3820;
            --accent-orange: #e65c00;
            --bg-light: #f4f7f4;
            --text-dark: #2c3e50;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #faf6f0;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .booking-container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e0e8e0;
        }

        h1 { color: var(--primary-color); text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; }

        .form-section {
            background-color: var(--bg-light);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-right: 4px solid var(--accent-orange);
        }

        .form-section h3 { margin-top: 0; color: var(--primary-color); font-size: 1.1rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .row-group { display: flex; gap: 12px; }
        .row-group .form-group { flex: 1; }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            cursor: pointer;
            font-weight: 600;
        }
        .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent-orange); }

        .submit-btn {
            width: 100%;
            background-color: var(--accent-orange);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover { background-color: #b85419; }

        .price-summary {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            color: var(--primary-color);
            text-align: center;
            font-size: 1.15rem;
        }

        .fighter-note {
            background-color: #e8f5e9;
            color: #1b3820;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.92rem;
            text-align: center;
            margin-bottom: 18px;
            border: 1px solid #c8e6c9;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="booking-container">
    <h1>הרשמה לפעילות</h1>
    <p class="subtitle">מדורת השבט — חנוכה של יער, אש ומלאכות 🕯️🌲🔥</p>

    <div class="fighter-note">
        🎖️ משרתי מילואים? ניתן לשלם ולממש הטבות עם <strong>כרטיס פייטר</strong>!
    </div>

    <form id="mainBookingForm">
        <!-- 1. בחירת פעילות -->
        <div class="form-section">
            <h3>1. בחירת אירוע/פעילות</h3>
            <div class="form-group">
                <label for="activitySelect">בחר/י פעילות:</label>
                <select id="activitySelect" onchange="handleActivityChange()" required>
                    <option value="">-- טוען פעילויות זמינות... --</option>
                </select>
            </div>
        </div>

        <!-- 2. פרטי מבוגר מלווה -->
        <div class="form-section">
            <h3>2. פרטי מבוגר אחראי</h3>
            <div class="row-group">
                <div class="form-group">
                    <label for="parentName">שם מלא:</label>
                    <input type="text" id="parentName" required>
                </div>
                <div class="form-group">
                    <label for="parentPhone">טלפון נייד:</label>
                    <input type="tel" id="parentPhone" required placeholder="050-0000000">
                </div>
            </div>
            <div class="form-group">
                <label for="parentEmail">דוא"ל:</label>
                <input type="email" id="parentEmail" required>
            </div>
        </div>

        <!-- 3. פרטי המשתתפים -->
        <div class="form-section" id="participantsSection">
            <h3>3. פרטי המשתתפים</h3>
        </div>

        <!-- 4. קופונים ותשלום -->
        <div class="form-section">
            <h3>4. תשלום והטבות</h3>
            <div class="row-group">
                <div class="form-group">
                    <label for="couponInput">קוד קופון (אופציונלי):</label>
                    <input type="text" id="couponInput" placeholder="הכנס קוד קופון" oninput="calculatePrice()">
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button type="button" onclick="calculatePrice()" style="width: 100%; padding: 10px; background: #2d5a37; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">החל קופון</button>
                </div>
            </div>
            <div id="couponMsg" style="font-size: 0.9rem; margin-bottom: 10px;"></div>

            <div class="price-summary" id="priceSummaryBox" style="display:none;">
                סה"כ לתשלום: <span id="finalPriceText">0</span> ₪
            </div>

            <div class="row-group">
                <div class="form-group">
                    <label for="paymentMethod">אמצעי תשלום מועדף:</label>
                    <select id="paymentMethod" required>
                        <option value="ביט / פייבוקס">ביט / PayBox</option>
                        <option value="כרטיס פייטר (משרתי מילואים)">כרטיס פייטר (משרתי מילואים)</option>
                        <option value="העברה בנקאית">העברה בנקאית</option>
                        <option value="כרטיס אשראי">כרטיס אשראי</option>
                        <option value="מזומן במקום">מזומן במקום</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="installments">מספר תשלומים:</label>
                    <select id="installments" required>
                        <option value="1 תשלום">תשלום 1</option>
                        <option value="2 תשלומים">2 תשלומים</option>
                        <option value="3 תשלומים">3 תשלומים</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">הערות נוספות:</label>
                <textarea id="notes" rows="2" placeholder="בקשות מיוחדות / רגישויות..."></textarea>
            </div>
        </div>

        <button type="submit" class="submit-btn">המשך לשליחה ב-WhatsApp</button>
    </form>
</div>

<script>
    const activities = [
        { id: 'hanukkah-adults-04-12', name: '4.12 (שישי) — זמן יער למבוגרים | יער רמת מנשה', type: 'adults' },
        { id: 'hanukkah-solo-camp-04-05-12', name: '4–5.12 — קמפינג יחידנים (אמא וילדים, אבא וילדים)', type: 'camping' },
        { id: 'hanukkah-givat-more-07-12', name: '7.12 (שני, 15:00–18:00) — מפגש חנוכה ביער גבעת המורה', type: 'workshop65' },
        { id: 'hanukkah-jordan-valley-09-12', name: '9.12 (רביעי, 15:00–18:00) — מפגש חנוכה בעמק הירדן', type: 'workshop65' },
        { id: 'hanukkah-morning-10-12', name: '10.12 (חמישי, 10:00–13:00) — זמן יער למשפחות', type: 'workshop65' },
        { id: 'hanukkah-family-camp-10-11-12', name: '10–11.12 (15:00 עד 14:00) — קמפינג משפחות', type: 'camping' },
        { id: 'hanukkah-shabbat-11-12', name: '11.12 (שישי, 15:00–18:00) — קבלת שבת שבטית והדלקת נרות חנוכה', type: 'workshop65' },
        { id: 'journey-04-12', name: 'זמן הורה וילד.ה (מפגש שני) - 04.12.2026', type: 'journey', basePrice: 390 },
        { id: 'journey-10-12', name: 'זמן הורה וילד.ה (סופ"ש חנוכה) - 10-11.12.2026', type: 'journey', basePrice: 780 }
    ];

    const activitySelect = document.getElementById('activitySelect');

    function loadActivities() {
        activitySelect.innerHTML = '<option value="">-- בחר/י פעילות --</option>';
        const urlParams = new URLSearchParams(window.location.search);
        const selectedFromUrl = urlParams.get('activity');

        activities.forEach(act => {
            const option = document.createElement('option');
            option.value = act.id;
            option.textContent = act.name;
            option.dataset.type = act.type;
            if (act.basePrice) {
                option.dataset.price = act.basePrice;
            }
            if (selectedFromUrl === act.id) {
                option.selected = true;
            }
            activitySelect.appendChild(option);
        });
        handleActivityChange();
    }

    function handleActivityChange() {
        const selectedOption = activitySelect.options[activitySelect.selectedIndex];
        const section = document.getElementById('participantsSection');
        section.innerHTML = '<h3>3. פרטי המשתתפים</h3>';

        if (!selectedOption || !selectedOption.dataset.type) {
            section.innerHTML += '<p style="color:#666;">יש לבחור פעילות כדי להציג את השדות המתאימים.</p>';
            document.getElementById('priceSummaryBox').style.display = 'none';
            return;
        }

        const type = selectedOption.dataset.type;

        if (type === 'adults') {
            section.innerHTML += `
                <div class="form-group">
                    <label for="adultsParticipants">בחרו הרכב השתתפות:</label>
                    <select id="adultsParticipants" onchange="calculatePrice()" required>
                        <option value="1">משתתף/ת 1 (120 ₪)</option>
                        <option value="2">זוג / 2 משתתפים (220 ₪)</option>
                    </select>
                </div>
            `;
        } else if (type === 'workshop65') {
            section.innerHTML += `
                <div class="row-group">
                    <div class="form-group">
                        <label for="paidCount65">מספר משתתפים מגיל 3 ומעלה (65 ₪ למשתתף):</label>
                        <input type="number" id="paidCount65" min="1" max="15" value="2" oninput="calculatePrice()" required>
                    </div>
                    <div class="form-group">
                        <label for="toddlersUnder3">ילדים מתחת לגיל 3 (ללא עלות):</label>
                        <input type="number" id="toddlersUnder3" min="0" max="10" value="0" oninput="calculatePrice()">
                    </div>
                </div>
            `;
        } else if (type === 'camping') {
            section.innerHTML += `
                <div class="row-group">
                    <div class="form-group">
                        <label for="campAdults">מספר מבוגרים (250 ₪ למבוגר):</label>
                        <input type="number" id="campAdults" min="1" max="6" value="1" oninput="calculatePrice()" required>
                    </div>
                    <div class="form-group">
                        <label for="campKids2Plus">ילדים מגיל שנתיים (170 ₪ לילד 1–2, 50 ₪ מילד 3):</label>
                        <input type="number" id="campKids2Plus" min="0" max="10" value="1" oninput="calculatePrice()" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="campKidsUnder2">ילדים מתחת לגיל שנתיים (ללא עלות):</label>
                    <input type="number" id="campKidsUnder2" min="0" max="5" value="0" oninput="calculatePrice()">
                </div>
                <label class="checkbox-row">
                    <input type="checkbox" id="ownGearDiscount" onchange="calculatePrice()">
                    <span>🎒 מגיעים עם אוהל ומזרנים מהבית (100 ₪ הנחה למשפחה)</span>
                </label>
            `;
        } else {
            section.innerHTML += `
                <div class="row-group">
                    <div class="form-group">
                        <label for="childName">שם הילד/ה:</label>
                        <input type="text" id="childName" required>
                    </div>
                    <div class="form-group">
                        <label for="childAge">גיל הילד/ה:</label>
                        <input type="number" id="childAge" min="1" max="18" required>
                    </div>
                    <div class="form-group">
                        <label for="childGender">מין הילד/ה:</label>
                        <select id="childGender" required>
                            <option value="">בחר/י</option>
                            <option value="בן">בן</option>
                            <option value="בת">בת</option>
                        </select>
                    </div>
                </div>
            `;
        }
        calculatePrice();
    }

    function calculatePrice() {
        const selectedOption = activitySelect.options[activitySelect.selectedIndex];
        if (!selectedOption || !selectedOption.dataset.type) return;

        let basePrice = 0;
        const type = selectedOption.dataset.type;

        if (type === 'adults') {
            const count = parseInt(document.getElementById('adultsParticipants').value) || 1;
            basePrice = (count === 2) ? 220 : 120;
        } else if (type === 'workshop65') {
            const paid = Math.max(1, parseInt(document.getElementById('paidCount65').value) || 1);
            basePrice = paid * 65;
        } else if (type === 'camping') {
            const adults = Math.max(1, parseInt(document.getElementById('campAdults').value) || 1);
            const kids = Math.max(0, parseInt(document.getElementById('campKids2Plus').value) || 0);
            const ownGear = document.getElementById('ownGearDiscount').checked;

            let kidsPrice = 0;
            if (kids === 1) kidsPrice = 170;
            else if (kids === 2) kidsPrice = 340;
            else if (kids >= 3) kidsPrice = 340 + (kids - 2) * 50;

            basePrice = (adults * 250) + kidsPrice - (ownGear ? 100 : 0);
            basePrice = Math.max(0, basePrice);
        } else {
            basePrice = parseInt(selectedOption.dataset.price || 0);
        }

        const couponInput = document.getElementById('couponInput').value.trim().toUpperCase();
        const couponMsg = document.getElementById('couponMsg');
        let discount = 0;

        if (couponInput === 'CLICKBATEVA26') {
            discount = Math.round(basePrice * 0.10);
            couponMsg.style.color = '#2e4d36';
            couponMsg.innerText = 'קוד קופון הוחל בהצלחה (10% הנחה)';
        } else if (couponInput !== '') {
            couponMsg.style.color = '#c0392b';
            couponMsg.innerText = 'קוד קופון שגוי או אינו בתוקף';
        } else {
            couponMsg.innerText = '';
        }

        const finalPrice = Math.max(0, basePrice - discount);
        document.getElementById('finalPriceText').innerText = finalPrice;
        document.getElementById('priceSummaryBox').style.display = 'block';
    }

    loadActivities();

    document.getElementById('mainBookingForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const selectedOption = activitySelect.options[activitySelect.selectedIndex];
        const activityName = selectedOption.text;
        const activityType = selectedOption.dataset.type;

        const parentName = document.getElementById('parentName').value;
        const parentPhone = document.getElementById('parentPhone').value;
        const paymentMethod = document.getElementById('paymentMethod').value;
        const installments = document.getElementById('installments').value;
        const notes = document.getElementById('notes').value || 'אין';

        let participantsText = '';

        if (activityType === 'adults') {
            const count = document.getElementById('adultsParticipants').value;
            participantsText = `הרכב: ${count === '2' ? 'זוג (220 ₪)' : 'משתתף/ת 1 (120 ₪)'}\n`;
        } else if (activityType === 'workshop65') {
            const paid = document.getElementById('paidCount65').value;
            const under3 = document.getElementById('toddlersUnder3').value || 0;
            participantsText = `משתתפים מגיל 3+: ${paid} | מתחת לגיל 3: ${under3}\n`;
        } else if (activityType === 'camping') {
            const adults = document.getElementById('campAdults').value;
            const kids = document.getElementById('campKids2Plus').value;
            const under2 = document.getElementById('campKidsUnder2').value || 0;
            const ownGear = document.getElementById('ownGearDiscount').checked ? 'כן (הנחת 100 ₪)' : 'לא (אוהל ומזרנים מאיתנו)';
            participantsText = `מבוגרים: ${adults} | ילדים (2+): ${kids} | מתחת לגיל 2: ${under2}\nציוד שינה מהבית: ${ownGear}\n`;
        } else {
            const childName = document.getElementById('childName').value;
            const childAge = document.getElementById('childAge').value;
            const childGender = document.getElementById('childGender').value;
            participantsText = `שם הילד/ה: ${childName} (גיל ${childAge}, ${childGender})\n`;
        }

        const finalPrice = document.getElementById('finalPriceText').innerText;

        const whatsappText = `היי טליה, נרשמתי דרך האתר! 🌲\n` +
            `פעילות: ${activityName}\n` +
            `שם הורה: ${parentName}\n` +
            `טלפון: ${parentPhone}\n` +
            participantsText +
            `סה"כ לתשלום: ${finalPrice} ₪\n` +
            `תשלום: ${paymentMethod} (${installments})\n` +
            `הערות: ${notes}`;

        const phoneNumber = "972559914540";
        const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(whatsappText)}`;
        window.open(whatsappUrl, '_blank');
    });
</script>

</body>
</html>

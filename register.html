<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טופס הרשמה | מדורת השבט</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #2e4d36;
            --warm-orange: #d97724;
            --bg-cream: #fbf8f3;
            --text-dark: #2c3531;
            --border-light: #e2ded4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            padding: 20px;
        }

        .form-container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 100%;
        }

        h2 {
            color: var(--primary-green);
            text-align: center;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--primary-green);
            font-size: 0.95rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            background-color: #fafafa;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--warm-orange);
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            height: 70px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            align-items: center;
            height: 42px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .radio-option input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-green);
        }

        .price-summary {
            background-color: #f4f6f4;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #d5ded7;
        }

        .price-summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .total-price-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid #bdc9c0;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary-green);
        }

        .submit-btn {
            width: 100%;
            background-color: #25d366;
            color: white;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background-color: #1ebc57;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>הרשמה לפעילות</h2>
       

        <form id="registerForm" onsubmit="sendToWhatsApp(event)">
            
            <!-- בחירת הפעילות -->
            <div class="form-group">
                <label for="eventSelect">בחירת הפעילות *</label>
                <select id="eventSelect" onchange="switchEventFields(); calculateTotal();" required>
                    <option value="journey">מסע הורה וילד</option>
                    <option value="yaar">יום יער</option>
                </select>
            </div>

            <!-- שדות משותפים (פרטי קשר) -->
            <div class="form-row" id="commonFields">
                <div class="form-group">
                    <label for="clientName" id="nameLabel">שם מלא של ההורה *</label>
                    <input type="text" id="clientName" required placeholder="...">
                </div>
                <div class="form-group">
                    <label for="phone">טלפון נייד *</label>
                    <input type="tel" id="phone" required placeholder="050-0000000">
                </div>
            </div>

            <div class="form-group">
                <label for="settlement">יישוב*</label>
                <input type="text" id="settlement" required placeholder="...">
            </div>

            <!-- ===== אזור ייעודי למסע הורה וילד (JOURNEY) ===== -->
            <div id="journeySpecificFields">
                <div class="form-group">
                    <label for="journeyOption">בחירת מסלול במסע *</label>
                    <select id="journeyOption" onchange="calculateTotal()">
                        <option value="full">הרשמה לכל 3 המפגשים (מסע שלם)</option>
                        <option value="m1">מפגש 1: עץ (20.11.26) - 390 ₪</option>
                        <option value="m2">מפגש 2: אש (4.12.26) - 390 ₪</option>
                        <option value="m3">מפגש 3: סופ"ש מסכם (10-11.12.26)  חופשת חנוכה - 780 ₪</option>
                    </select>
                </div>

              
                    <div class="form-group">
                        <label for="childAge">גיל הילד/ה *</label>
                        <input type="number" id="childAge" min="6" max="18" placeholder="6-14">
                    </div>
                </div>

                <div class="form-group">
                    <label>מין הילד/ה *</label>
                    <div class="radio-group">
                        <label class="radio-option"><input type="radio" name="childGender" value="ילד"> ילד</label>
                        <label class="radio-option"><input type="radio" name="childGender" value="ילדה"> ילדה</label>
                    </div>
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; font-weight: normal; cursor: pointer;">
                        <input type="checkbox" id="tentRental" onchange="calculateTotal()" style="width: auto;">
                        מעוניינים בהשאלת אוהל ומזרנים לסופ"ש (+50 ₪)
                    </label>
                </div>
            </div>

            <!-- ===== אזור ייעודי ליום יער (YAAR) ===== -->
            <div id="yaarSpecificFields" style="display: none;">
                <div class="form-group">
                    <label for="extraParticipants">הרכב משפחתי (בחירת משתתפים) *</label>
                    <select id="extraParticipants" onchange="calculateTotal()">
                        <option value="0">הורה וילד.ה - 190 ₪</option>
                        <option value="1">3 משתתפים - 255 ₪</option>
                        <option value="2"> 4-6 משתתפים (משפחה גרעינית - 290 ₪ </option>
               
                    </select>
                </div>
            </div>

            <!-- קוד קופון הנחה -->
            <div class="form-group">
                <label for="couponCode">קוד קופון </label>
                <input type="text" id="couponCode" placeholder="..." style="text-transform: uppercase;" oninput="calculateTotal()">
                <small id="couponMessage" style="display: block; margin-top: 4px; font-weight: bold;"></small>
            </div>

            <!-- אמצעי תשלום ומספר תשלומים -->
            <div class="form-row">
                <div class="form-group">
                    <label for="paymentMethod">אמצעי תשלום מועדף *</label>
                    <select id="paymentMethod" required>
                        <option value="ביט (Bit)">ביט (Bit)</option>
                        <option value="העברה בנקאית">העברה בנקאית</option>
                        <option value="מזומן">מזומן</option>
                        <option value="כרטיס אשראי">כרטיס אשראי</option>
                        <option value="כרטיס פייטר (מילואים)">כרטיס פייטר (מילואים)</option>
                        
                    </select>
                </div>
                <div class="form-group">
                    <label for="paymentsSelect">מספר תשלומים *</label>
                    <select id="paymentsSelect" required>
                        <!-- מתעדכן אוטומטית לפי הסכום -->
                    </select>
                </div>
            </div>

            <!-- הערות או בקשות מיוחדות -->
            <div class="form-group">
                <label for="clientRemarks">הערות / בקשות מיוחדות</label>
                <textarea id="clientRemarks" placeholder="..."></textarea>
            </div>

            <!-- סיכום מחיר -->
            <div class="price-summary">
                <div class="price-summary-row">
                    <span>מחיר בסיס:</span>
                    <span id="basePriceDisplay">0 ₪</span>
                </div>
                <div class="price-summary-row" id="discountRow" style="display: none; color: #d97724;">
                    <span>הנחת הרשמה מוקדמת:</span>
                    <span id="discountDisplay">0 ₪</span>
                </div>
                <div class="price-summary-row" id="addonRow" style="display: none;">
                    <span>תוספות:</span>
                    <span id="addonDisplay">0 ₪</span>
                </div>
                <div class="total-price-row">
                    <span>סה"כ לתשלום:</span>
                    <span id="totalPriceDisplay">0 ₪</span>
                </div>
            </div>

            <button type="submit" class="submit-btn">
                 המשך
            </button>
        </form>
    </div>

    <!-- כאן מתחיל הסקריפט בצורה תקינה -->
    <script>
        function switchEventFields() {
            const eventVal = document.getElementById('eventSelect').value;
            const journeyDiv = document.getElementById('journeySpecificFields');
            const yaarDiv = document.getElementById('yaarSpecificFields');
            const nameLabel = document.getElementById('nameLabel');

            if (eventVal === 'journey') {
                journeyDiv.style.display = 'block';
                yaarDiv.style.display = 'none';
                nameLabel.innerText = "שם ההורה *";
            } else {
                journeyDiv.style.display = 'none';
                yaarDiv.style.display = 'block';
                nameLabel.innerText = "שם ההורה *";
            }
        }

        function calculateTotal() {
            const eventVal = document.getElementById('eventSelect').value;
            const couponInput = document.getElementById('couponCode').value.trim().toUpperCase();
            const couponMsg = document.getElementById('couponMessage');

            let basePrice = 0;
            let discount = 0;
            let addonCost = 0;

            const today = new Date();
            const earlyBirdDeadline = new Date('2026-11-07T23:59:59');

            if (eventVal === 'journey') {
                const jOpt = document.getElementById('journeyOption').value;
                const rentalChecked = document.getElementById('tentRental').checked;

                if (jOpt === 'full') {
                    basePrice = 1560;
                    if (today <= earlyBirdDeadline) discount = 200; 
                    if (rentalChecked) addonCost += 50;
                } else if (jOpt === 'm1' || jOpt === 'm2') {
                    basePrice = 390;
                } else if (jOpt === 'm3') {
                    basePrice = 780;
                    if (rentalChecked) addonCost += 50;
                }
            } else {
                const extraCount = parseInt(document.getElementById('extraParticipants').value) || 0;
                let subtotal = 190 + (extraCount * 65);
                if (subtotal > 290) subtotal = 290; 
                basePrice = subtotal;
            }

            if (couponInput === 'CLICKBATEVA26' || couponInput.length >= 4) {
                discount += Math.round(basePrice * 0.10);
                couponMsg.style.color = '#2e4d36';
                couponMsg.innerText = 'קוד קופון הוחל בהצלחה';
            } else {
                couponMsg.innerText = '';
            }

            let finalTotal = basePrice - discount + addonCost;

            document.getElementById('basePriceDisplay').innerText = basePrice.toLocaleString() + ' ₪';
            
            if (discount > 0) {
                document.getElementById('discountRow').style.display = 'flex';
                document.getElementById('discountDisplay').innerText = '-' + discount.toLocaleString() + ' ₪';
            } else {
                document.getElementById('discountRow').style.display = 'none';
            }

            if (addonCost > 0) {
                document.getElementById('addonRow').style.display = 'flex';
                document.getElementById('addonDisplay').innerText = '+' + addonCost.toLocaleString() + ' ₪';
            } else {
                document.getElementById('addonRow').style.display = 'none';
            }

            document.getElementById('totalPriceDisplay').innerText = finalTotal.toLocaleString() + ' ₪';

            updatePaymentsDropdown(finalTotal);
        }

        function updatePaymentsDropdown(total) {
            const select = document.getElementById('paymentsSelect');
            select.innerHTML = '';

            let maxPayments = Math.floor(total / 200);
            if (maxPayments < 1) maxPayments = 1;
            if (maxPayments > 10) maxPayments = 10;

            for (let i = 1; i <= maxPayments; i++) {
                let instPrice = Math.round(total / i);
                let opt = document.createElement('option');
                opt.value = i;
                opt.text = i === 1 ? `תשלום 1 יחיד (${total} ₪)` : `${i} תשלומים שווים (${instPrice} ₪ לתשלום)`;
                select.appendChild(opt);
            }
        }

        function sendToWhatsApp(event) {
            event.preventDefault();
            
            const eventVal = document.getElementById('eventSelect').value;
            const clientName = document.getElementById('clientName').value;
            const phone = document.getElementById('phone').value;
            const settlement = document.getElementById('settlement').value;
            const paymentMethod = document.getElementById('paymentMethod').value;
            const payments = document.getElementById('paymentsSelect').selectedOptions[0].text;
            const remarks = document.getElementById('clientRemarks').value.trim();
            const totalPrice = document.getElementById('totalPriceDisplay').innerText;

            let eventNameDisplay = "";
            let detailsText = "";

            if (eventVal === 'journey') {
                const jOptText = document.getElementById('journeyOption').selectedOptions[0].text;
              
                const cAge = document.getElementById('childAge').value;
                const cGender = document.querySelector('input[name="childGender"]:checked')?.value || 'לא צוין';
                const rental = document.getElementById('tentRental').checked ? 'כן (+50 ₪)' : 'לא';

                eventNameDisplay = "מסע הורה וילד";
                detailsText += ` מסלול: ${jOptText}\n`;
                detailsText += ` מבוגר/ת: ${clientName} (${pGender})\n`;
                detailsText += ` ילד/ה: גיל ${cAge} (${cGender})\n`;
                detailsText += ` השאלת אוהל: ${rental}\n`;
            } else {
                const extraText = document.getElementById('extraParticipants').selectedOptions[0].text;
                eventNameDisplay = 'יום יער';
                detailsText += `הרכב משפחתי: ${extraText}\n`;
                detailsText += `שם המזמין/ה: ${clientName}\n`;
            }

            let message = `היי, אני רוצה להירשם לפעילות ב'מדורת השבט'! 🌿\n\n`;
            message += `פעילות: ${eventNameDisplay}\n`;
            message += detailsText;
            message += `טלפון: ${phone}\n`;
            message += `יישוב: ${settlement}\n`;
            message += `אמצעי תשלום: ${paymentMethod} (${payments})\n`;
            if (remarks) {
                message += `הערות: ${remarks}\n`;
            }
            message += `סה"כ לתשלום: ${totalPrice}\n\n`;
            message += `אשמח לקבל קישור להשלמת התשלום.`;

            const phoneNumber = "972559914540";
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            
            window.open(whatsappUrl, '_blank');
        }

        window.onload = function() {
            switchEventFields();
            calculateTotal();
        };
    </script>
</body>
</html>
